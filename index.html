<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2340c8">
<title>قارئ الفواتير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#eef0f6,#0e1222);--band:light-dark(#2340c8,#1a2a7a);--paper:light-dark(#fff,#171c33);
--ink:light-dark(#121528,#e9ebf5);--mute:light-dark(#5a5f78,#a3a8c3);--line:light-dark(#dfe2ee,#2c3354);
--blue:light-dark(#2340c8,#8ea2ff);--stamp:light-dark(#c81d33,#ff7b8b);--ok:light-dark(#11743f,#5fd69a);--soft:light-dark(#f3f5fc,#1e2442);--warnbg:light-dark(#fff3f4,#2a1720)}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.2;margin:0}
.top{background:var(--band);color:#fff;padding:clamp(20px,4vw,36px) max(5vw,16px) 80px}
.top h1{font-size:clamp(28px,5vw,40px)}
.top p{margin:6px 0 0;opacity:.92}
main{max-width:1000px;margin:-56px auto 48px;padding:0 max(3vw,12px);display:grid;gap:18px}
.slip{background:var(--paper);border-radius:6px;padding:clamp(16px,3vw,26px);box-shadow:0 1px 0 var(--line),0 18px 40px -24px #0b1550aa}
.drop{border:2px dashed var(--line);border-radius:6px;padding:22px 14px;text-align:center}
.drop.over{border-color:var(--blue);background:var(--soft)}
.drop p{margin:0;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
button,.btn{font:inherit;font-weight:500;min-height:44px;padding:8px 18px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;text-decoration:none}
button:focus-visible,.btn:focus-within,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0e1222)}
button:disabled{opacity:.5;cursor:default}
.btn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.prog{margin-top:14px;display:none}.prog.on{display:block}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.status{margin-top:8px;color:var(--mute);text-align:center;min-height:1.6em}.status.err{color:var(--stamp)}
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.lhead h2{font-size:22px}.lhead .note{color:var(--mute);font-size:14px;flex-basis:100%}
#list{display:grid;gap:14px}
.inv{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--paper)}
.inv.pend{color:var(--mute);background:var(--soft)}
.inv header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.inv header b{font-size:17px;display:block}
.fp{color:var(--mute);font-size:12px;word-break:break-all;display:block}
.amt{font-family:"Readex Pro",sans-serif;font-weight:700;color:var(--blue);font-size:20px;white-space:nowrap;direction:ltr}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.f{display:grid;gap:3px;font-size:13px;color:var(--mute)}.f.wide{grid-column:1/-1}
.f input,.f textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-height:42px}
.f input.num{direction:ltr;text-align:right}
.f.miss input{border:2px solid var(--stamp);background:var(--warnbg)}
.f.miss span{color:var(--stamp);font-weight:500}
.warn{margin:10px 0 0;padding:8px 12px 8px 8px;list-style:none;background:var(--warnbg);border-inline-start:4px solid var(--stamp);border-radius:4px;color:var(--stamp);font-size:14px;display:grid;gap:2px}
.warn li::before{content:"⚠ "}
.okline{margin:10px 0 0;color:var(--ok);font-size:14px}
.inv footer{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.del{color:var(--stamp);border-color:currentColor}
.empty{color:var(--mute);text-align:center;margin:10px 0}
.lb{position:fixed;inset:0;background:#000c;z-index:50;display:flex;flex-direction:column}
.lbbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--paper)}
.lbbar #lbT{flex:1 1 200px;font-size:13px;color:var(--mute);word-break:break-all}
.lbstage{flex:1;overflow:auto;direction:ltr;text-align:center;background:#222}
.lbstage img{display:block;margin:0 auto;max-width:none;background:#fff}
#lbNone{color:#fff;padding:30px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(120px);opacity:0;visibility:hidden;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;transition:transform .25s;z-index:60;max-width:92vw}
.toast.on{transform:translateX(-50%);opacity:1;visibility:visible}
.undo{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--ink);color:var(--paper);padding:6px 6px 6px 14px;border-radius:6px;display:flex;gap:12px;align-items:center;z-index:61}
.undo button{min-height:36px;background:var(--paper);color:var(--ink)}
.full{color:#fff;opacity:.8;font-size:13px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr}.f-vendor_name,.f-vendor_tax_number{grid-column:1/-1}.inv footer button{flex:1}}
</style>
</head>
<body>
<header class="top">
  <h1>قارئ الفواتير</h1>
  <p>صوّر الفاتورة أو ارفعها، راجع البيانات وأكمل الناقص، ثم نزّل ملف Excel.</p>
</header>
<main>
  <section class="slip">
    <div class="drop" id="drop">
      <p>اسحب الفواتير إلى هنا (صور أو PDF)، أو اختر:</p>
      <div class="btns">
        <label class="btn primary">📷 تصوير فاتورة<input id="cam" type="file" accept="image/*" capture="environment"></label>
        <label class="btn">📄 اختيار ملفات<input id="pick" type="file" accept="image/*,application/pdf" multiple></label>
        <label class="btn">📂 اختيار مجلد<input id="dir" type="file" webkitdirectory multiple></label>
      </div>
    </div>
    <div class="prog" id="prog"><div class="bar"><i id="barI"></i></div></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
  <section class="slip" aria-labelledby="lT">
    <div class="lhead"><h2 id="lT">الفواتير <span id="count"></span></h2><button class="primary" id="xl" disabled>تنزيل ملف Excel</button><span class="note" id="sum"></span></div>
    <div id="list"></div>
  </section>
  <p style="text-align:center;margin:0"><a href="full.html" style="color:var(--mute);font-size:13px">النسخة الكاملة السابقة</a></p>
</main>
<datalist id="pays"><option>نقدًا</option><option>مدى</option><option>بطاقة ائتمان</option><option>تحويل بنكي</option><option>آجل</option><option>شيك</option><option>Apple Pay</option></datalist>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lbT">
  <div class="lbbar"><span id="lbT"></span><button id="lbPrev">السابقة</button><span id="lbPg"></span><button id="lbNext">التالية</button><button id="lbOut" aria-label="تصغير">−</button><span id="lbZ"></span><button id="lbIn" aria-label="تكبير">+</button><a class="btn" id="lbOrig" target="_blank" rel="noopener">الملف الأصلي</a><button id="lbClose" class="primary">إغلاق</button></div>
  <div class="lbstage"><img id="lbImg" alt="صورة الفاتورة"><p id="lbNone">لا توجد صورة محفوظة لهذه الفاتورة.</p></div>
</div>
<div class="undo" id="undo" hidden><span></span><button>تراجع</button></div>
<div class="toast" id="toast" role="status"></div>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script src="parse.js?v=202611251835"></script>
<script src="export.js?v=202611251835"></script>
<script src="digits.js?v=202611251835"></script>
<script src="simple.js?v=202611251835"></script>
</body>
</html>
